font_family      family="Maple Mono Normal"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

disable_ligatures never
modify_font       underline_position  12
modify_font       underline_thickness 150%
resize_in_steps   yes

cursor_trail 0

copy_on_select no
allow_remote_control yes
scrollback_lines 500000

# Allow remote applications to read and write to your local clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

show_hyperlink_targets no
detect_urls no

strip_trailing_spaces always

enabled_layouts fat:bias=75
tab_bar_style slant
tab_bar_min_tabs 2

close_on_child_death yes

shell_integration enabled

kitty_mod super
map kitty_mod+b next_window
map ctrl+tab no_op
map ctrl+shift+v        paste_from_clipboard
# clear_all_mouse_actions yes

background_image ~/Pictures/nyc.jpg
background_image_layout scaled
background_tint 0.99
#background_opacity 0.1
#background_blur 10

